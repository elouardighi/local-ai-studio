name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The suite is Windows-only: the resource monitor talks to the Windows PDH
# performance counters through ctypes, and the process manager uses the
# Windows console API. It cannot run anywhere else.

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r local-ai-studio/requirements.txt

      - name: Run the test suite
        # The tests never touch a GPU, a network or a real model: the
        # engine is faked, so this is fast and safe to run anywhere.
        working-directory: local-ai-studio
        run: python -m pytest tests -q

  frontend:
    name: frontend (node --test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the frontend unit tests
        # The test runner is pointed at the directory and finds the files
        # itself. A wildcard on the command line would depend on the shell
        # expanding it, and the runner's shell does not.
        working-directory: local-ai-studio/frontend
        run: node --test
